name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint

  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install compact CLI + compiler 0.31.1
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          compact update 0.31.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm --filter @witnessfitness/contract check
          pnpm --filter @witnessfitness/api check
          # dist/ is gitignored — the ui resolves @witnessfitness/api|contract
          # through their dist exports, so the api must be built (emit) here.
          pnpm --filter @witnessfitness/api build
          pnpm --filter @witnessfitness/notary exec tsc --project ./tsconfig.build.json --noEmit
          pnpm --filter ui exec tsc --noEmit
      - name: Tests
        run: pnpm -r test
      - name: UI bundle
        run: pnpm --filter ui exec vite build
